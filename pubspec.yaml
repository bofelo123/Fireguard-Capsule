name: fireguard_command
description: FireGuard National Wildfire Command Center
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.0

  # Network & Storage
  connectivity_plus: ^6.0.3
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.2
  permission_handler: 13.0.1

  # Maps
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.8.0

  # Voice
  speech_to_text: ^7.4.0
  speech_to_text_windows: ^1.0.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

dependency_overrides:
  permission_handler_android: 13.0.1